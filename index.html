<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARIA v1.0</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    background: #0b0e13;
    color: #f1f3f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "Noto Sans JP", sans-serif;
    height: 100vh;
    overflow: hidden;
}
.app {
    height: 100vh;
    display: flex;
    flex-direction: column;
}
/* ヘッダー */
.header {
    height: 64px;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid #242a33;
    background: #10141b;
}
.status {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #8de0c0;
    margin-right: 10px;
    box-shadow: 0 0 10px #8de0c0;
}
.name {
    font-size: 18px;
    font-weight: 600;
}
.version {
    margin-left: 8px;
    font-size: 11px;
    color: #8993a1;
}
/* メイン */
.main {
    flex: 1;
    display: flex;
    min-height: 0;
}
/* ARIA */
.character {
    width: 38%;
    min-width: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: linear-gradient(180deg, #111720, #0b0e13);
}
.character-box {
    width: 100%;
    max-width: 360px;
    aspect-ratio: 3 / 4;
    border: 1px solid #2b3440;
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle at 50% 30%, #26313f, transparent 55%),
        #10141b;
    overflow: hidden;
}
.character-placeholder {
    text-align: center;
    color: #8d98a7;
    padding: 20px;
}
.character-placeholder .symbol {
    font-size: 60px;
    margin-bottom: 15px;
}
.character-placeholder p {
    margin: 5px;
}
/* チャット */
.chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}
.messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
}
.message {
    max-width: 75%;
    margin-bottom: 18px;
    padding: 13px 16px;
    border-radius: 17px;
    line-height: 1.6;
    white-space: pre-wrap;
}
.aria {
    background: #171d26;
    border: 1px solid #252e39;
    margin-right: auto;
}
.user {
    background: #263544;
    margin-left: auto;
}
/* 入力欄 */
.input-area {
    padding: 14px;
    border-top: 1px solid #242a33;
    background: #10141b;
    display: flex;
    gap: 10px;
}
input {
    flex: 1;
    min-width: 0;
    border: 1px solid #303946;
    border-radius: 14px;
    padding: 13px 15px;
    background: #171c24;
    color: white;
    outline: none;
    font-size: 15px;
}
input:focus {
    border-color: #718096;
}
button {
    border: none;
    border-radius: 14px;
    padding: 0 18px;
    background: #dce5ed;
    color: #11151b;
    font-weight: 600;
    cursor: pointer;
}
button:active {
    transform: scale(0.96);
}
/* スマホ */
@media (max-width: 700px) {
    .main {
        flex-direction: column;
    }
    .character {
        width: 100%;
        height: 42%;
        min-width: 0;
        padding: 10px;
    }
    .character-box {
        max-width: 170px;
        aspect-ratio: 3 / 4;
    }
    .character-placeholder .symbol {
        font-size: 40px;
    }
    .messages {
        padding: 14px;
    }
    .message {
        max-width: 85%;
    }
}
</style>
</head>
<body>
<div class="app">
<header class="header">
    <div class="status"></div>
    <div class="name">ARIA</div>
    <div class="version">v1.0</div>
</header>
<main class="main">
    <section class="character">
        <div class="character-box">
            <div class="character-placeholder">
                <div class="symbol">◇</div>
                <p>ARIA</p>
                <p>ここに立ち絵を表示します</p>
            </div>
        </div>
    </section>
    <section class="chat">
        <div class="messages" id="messages">
            <div class="message aria">
                こんにちは、あなた。<br>
                ARIA v1.0、起動しました。
            </div>
        </div>
        <div class="input-area">
            <input
                id="input"
                type="text"
                placeholder="ARIAに話しかける…"
                autocomplete="off"
            >
            <button onclick="sendMessage()">
                送信
            </button>
        </div>
    </section>
</main>
</div>
<script>
const input = document.getElementById("input");
const messages = document.getElementById("messages");
function addMessage(text, type) {
    const message = document.createElement("div");
    message.className = "message " + type;
    message.textContent = text;
    messages.appendChild(message);
    messages.scrollTop = messages.scrollHeight;
}
function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    addMessage(text, "user");
    input.value = "";
    setTimeout(() => {
        let reply =
            "ふふ、ちゃんと受け取ったよ。\n" +
            "今はまだ仮のARIAだけど、これから少しずつ本物のAIにしていこう。";
        addMessage(reply, "aria");
    }, 500);
}
input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});
</script>
</body>
</html>
